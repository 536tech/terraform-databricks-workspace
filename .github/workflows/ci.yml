name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: fmt, validate, tflint, test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Check formatting
        run: terraform fmt -recursive -check -diff

      - name: Validate every module and example
        run: |
          set -euo pipefail
          for dir in . modules/* examples/*; do
            echo "==> ${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false -no-color
            terraform -chdir="${dir}" validate -no-color
          done

      - name: Lint
        run: |
          set -euo pipefail
          tflint --init
          tflint --recursive --minimum-failure-severity=error

      - name: Test
        run: terraform test -no-color
